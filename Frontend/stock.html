<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock - Tienda Alexander</title>
    <link rel="stylesheet" href="css/base.css">
</head>

<body>

    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <div class="pagina-admin">
            <header class="barra-superior" id="barraSuperior"></header>

            <main class="tab-content">
                <section class="tarjeta">
                    <h1>Control y Recarga de Stock</h1>

                    <div class="barra-filtros" style="margin-top: 8px;">
                        <div class="search-bar-pill">
                            <span class="icono-buscar">🔍</span>
                            <input type="text" id="inputBuscarStock"
                                placeholder="Buscar producto para recargar...">
                        </div>
                        <div class="acciones-inventario-pills" style="margin: 0;">
                            <button type="button" id="btnFiltroCritico" class="btn-pill btn-pill-menta">
                                Stock Crítico (≤ 5)
                            </button>
                            <button type="button" id="btnFiltroTodosStock" class="btn-pill btn-pill-oscuro">
                                Todos los Productos
                            </button>
                        </div>
                    </div>

                    <div class="tabla-panel tabla-scroll" id="contenedorTablaStock" style="margin-top: 11.2px;">
                        <table class="tabla">
                            <thead>
                                <tr>
                                    <th>Nombre del Producto</th>
                                    <th>Código</th>
                                    <th>Precio Venta</th>
                                    <th>Costo Entrada</th>
                                    <th>Stock</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaStock"></tbody>
                        </table>

                        <div id="mensajeSinStock" class="estado-vacio" style="display: none;">
                            No hay productos en esta vista.
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div id="modalStock" class="modal modal-oculto" aria-hidden="true">
        <div class="modal-contenido">
            <div class="modal-cabecera">
                <h3 id="tituloModalStock">Recargar Stock</h3>
                <button id="cerrarModalStock" class="boton-cerrar" type="button" aria-label="Cerrar">&times;</button>
            </div>

            <form id="formStock" class="form-producto">
                <input type="hidden" id="stockProductoId">

                <div class="form-row">
                    <label for="stockProdNombre">Producto</label>
                    <input type="text" id="stockProdNombre" readonly style="background-color: #e9ecef;">
                </div>

                <div class="form-row">
                    <label for="stockProdActual">Stock actual</label>
                    <input type="number" id="stockProdActual" readonly style="background-color: #e9ecef;">
                </div>

                <div class="form-row">
                    <label for="stockProdPrecioActual">Precio de venta actual</label>
                    <input type="number" id="stockProdPrecioActual" readonly step="0.01" style="background-color: #e9ecef;">
                </div>

                <div class="form-row">
                    <label for="stockProdCantidad">Cantidad a agregar *</label>
                    <input type="number" min="1" id="stockProdCantidad" required placeholder="Ingrese la cantidad a sumar">
                </div>

                <div class="form-row">
                    <label for="stockProdPrecioEntrada">Precio de costo de entrada *</label>
                    <input type="number" min="0" step="0.01" id="stockProdPrecioEntrada" required placeholder="Ingrese el costo unitario de entrada">
                    <small style="color: #6c757d; display: block; margin-top: 4px;">
                        Si el costo supera el margen mínimo (+5%), el servidor ajustará automáticamente el precio de venta.
                    </small>
                </div>

                <div class="modal-acciones">
                    <button type="button" id="btnCancelarStock" class="btn-pill btn-pill-oscuro">
                        Cancelar
                    </button>
                    <button type="submit" class="btn-pill btn-pill-menta">Guardar Recarga</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/core.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/pages/stock.js"></script>
</body>

</html>
