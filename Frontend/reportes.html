<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Tienda Alexander</title>
    <link rel="stylesheet" href="css/base.css">
</head>

<body>

    <div class="dashboard-layout">

        <aside class="sidebar" id="sidebar"></aside>

        <div class="pagina-admin">

            <header class="barra-superior" id="barraSuperior"></header>

            <main class="tab-content">

                <section class="tarjeta">
                    <h1 id="tituloVistaReporte">Reporte de Ventas del Día Actual</h1>

                    <div class="kpi-grid">
                        <article class="kpi-card">
                            <h3>Total Vendido</h3>
                            <p class="kpi-valor" id="kpiVentasHoy">$0.00</p>
                        </article>
                        <article class="kpi-card">
                            <h3>Transacciones</h3>
                            <p class="kpi-valor" id="kpiCantidadVentasHoy">0</p>
                        </article>
                        <article class="kpi-card">
                            <h3>Productos Vendidos</h3>
                            <p class="kpi-valor" id="kpiProductosVendidosHoy">0</p>
                        </article>
                    </div>

                    <div class="acciones-inventario-pills" style="margin-bottom: 20px;">
                        <button type="button" id="btnReporteHoy" class="btn-pill btn-pill-menta">
                            Ventas del Día
                        </button>
                        <button type="button" id="btnReporteSemanal" class="btn-pill btn-pill-oscuro">
                            Últimos 7 Días
                        </button>
                        <button type="button" id="btnReporteMensual" class="btn-pill btn-pill-oscuro">
                            Últimos 30 Días
                        </button>
                    </div>

                    <div class="tabla-panel">
                        <table class="tabla">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>ID Venta</th>
                                    <th>Método de Pago</th>
                                    <th>Total</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="tablaVentasReporte"></tbody>
                        </table>
                        <div id="mensajeSinReportes" class="estado-vacio" style="display: none;">
                            No se encontraron registros de ventas para este período.
                        </div>
                    </div>

                    <div class="acciones-inventario-pills">
<button type="button" id="btnExportarExcel" class="btn-pill btn-pill-menta">
                            Exportar a Excel (CSV)
                        </button>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <script src="js/core.js"></script>
    <script src="js/demo.js"></script>

    <script src="js/layout.js"></script>
    <script src="js/pages/reportes.js"></script>
</body>

</html>
