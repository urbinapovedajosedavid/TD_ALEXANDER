<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear usuario - Tienda Alexander</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-contenedor">
        <section class="login-panel">

            <div class="login-brand">
                <div class="logo-circulo">
                    <img src="https://i.postimg.cc/XqZdZjvF/logo-TD.jpg" alt="Gestión Alexander">
                </div>
                <div>
                    <h1>GestiónApp</h1>
                    <p>Alta de usuario</p>
                </div>
            </div>

            <div class="login-card">
                <h2 id="tituloRegistro">Crear cuenta de vendedor</h2>

                <form id="formUsuarioModal" class="formulario">
                    <label for="nombreModal">Nombre</label>
                    <input id="nombreModal" name="nombreModal" type="text"
                        placeholder="Tu nombre" autocomplete="given-name" required>

                    <label for="apellidoModal">Apellido</label>
                    <input id="apellidoModal" name="apellidoModal" type="text"
                        placeholder="Tu apellido" autocomplete="family-name" required>

                    <label for="telefonoModal">Número de teléfono</label>
                    <input id="telefonoModal" name="telefonoModal" type="tel"
                        placeholder="Ej: 8888-8888" autocomplete="tel" required>

                    <label for="usuarioModal">Nombre de usuario</label>
                    <input id="usuarioModal" name="usuarioModal" type="text"
                        placeholder="Mínimo 3 caracteres" minlength="3"
                        autocomplete="username" required>

                    <div id="contenedorRolAdmin" class="form-row" hidden>
                        <label for="rolModal">Rol del usuario</label>
                        <select id="rolModal" name="rolModal">
                            <option value="VENDEDOR">Vendedor</option>
                            <option value="ADMIN">Administrador</option>
                        </select>
                    </div>

                    <label for="claveModal">Contraseña</label>
                    <div class="campo-password">
                        <input id="claveModal" name="claveModal" type="password"
                            placeholder="Mínimo 4 caracteres" minlength="4"
                            autocomplete="new-password" required>
                        <button type="button" class="btn-ver-password" data-target="claveModal"
                            aria-label="Mostrar contraseña" title="Mostrar contraseña">
                            <svg class="icono-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>

                    <div id="confirmacionAdmin" class="form-row" hidden>
                        <label for="claveAdminModal">Confirma con tu contraseña de administrador</label>
                        <div class="campo-password">
                            <input id="claveAdminModal" name="claveAdminModal" type="password"
                                placeholder="Contraseña de administrador" autocomplete="current-password">
                            <button type="button" class="btn-ver-password" data-target="claveAdminModal"
                                aria-label="Mostrar contraseña" title="Mostrar contraseña">
                                <svg class="icono-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-pill btn-pill-oscuro">Guardar usuario</button>
                    <button type="button" id="btnEntrarNuevo" class="btn-pill btn-pill-menta" hidden>
                        Ir a iniciar sesión
                    </button>
                    <button type="button" id="btnVolverLogin" class="btn-pill btn-pill-menta">
                        Volver al inicio de sesión
                    </button>

                    <p id="mensajeModal" class="mensaje" aria-live="polite"></p>
                </form>
            </div>

        </section>
    </main>
    <script src="js/core.js"></script>
    <script src="js/pages/registro.js"></script>
</body>

</html>
