<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Ventas - Tienda Alexander</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/ventas.css">
</head>

<body>

    <div class="dashboard-layout">

        <aside class="sidebar" id="sidebar"></aside>

        <div class="pagina-admin">

            <header class="barra-superior" id="barraSuperior"></header>

            <main class="tab-content">

                <section class="tarjeta">
                    <h1>Terminal de Ventas</h1>

                    <div class="layout-ventas">

                        <!-- Columna izquierda: búsqueda de productos -->
                        <div class="panel-venta">
                            <h3>Buscar Producto</h3>

                            <div class="search-bar-pill">
                                <span class="icono-buscar">🔍</span>
                                <input type="text" id="inputBuscarVentaProducto"
                                    placeholder="Escanear código de barras o buscar por nombre...">
                            </div>

                            <div class="tabla-panel tabla-panel-scroll">
                                <table class="tabla">
                                    <thead>
                                        <tr>
                                            <th>Código</th>
                                            <th>Producto</th>
                                            <th>Precio</th>
                                            <th>Stock</th>
                                            <th>Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaBusquedaProductosVenta"></tbody>
                                </table>
                                <div id="mensajeSinProductosVenta" class="estado-vacio" style="display: none;">
                                    No se encontraron productos.
                                </div>
                            </div>
                        </div>

                        <!-- Columna derecha: carrito y cobro -->
                        <div class="panel-venta">
                            <h3>Detalle de la Venta</h3>

                            <div class="tabla-panel tabla-panel-scroll">
                                <table class="tabla">
                                    <thead>
                                        <tr>
                                            <th>Ítem</th>
                                            <th>Cant.</th>
                                            <th>Precio</th>
                                            <th>Subtotal</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaCarritoVentas"></tbody>
                                </table>
                                <div id="mensajeCarritoVacio" class="estado-vacio" style="display: none;">
                                    El carrito está vacío.
                                </div>
                            </div>

                            <div class="resumen-cobro">
                                <div class="linea-resumen">
                                    <span>Subtotal:</span>
                                    <span id="subtotalVentaValor">C$0.00</span>
                                </div>
                                <div class="linea-resumen">
                                    <span>Impuesto (IVA):</span>
                                    <span id="impuestoVentaValor">C$0.00</span>
                                </div>
                                <div class="linea-resumen total-destacado">
                                    <span>Total a Pagar:</span>
                                    <span id="totalVentaValor">C$0.00</span>
                                </div>

                                <div class="form-cobro-acciones">
                                    <label for="selectMetodoPago">Método de pago:</label>
                                    <select id="selectMetodoPago">
                                        <option value="efectivo">Efectivo</option>
                                        <option value="tarjeta">Tarjeta de Crédito / Débito</option>
                                        <option value="transferencia">Transferencia Bancaria</option>
                                    </select>

                                    <button type="button" id="btnCompletarVenta"
                                        class="btn-pill btn-pill-menta btn-bloque">
                                        Procesar y Cobrar
                                    </button>
                                    <button type="button" id="btnCancelarVenta"
                                        class="btn-pill btn-pill-oscuro btn-bloque">
                                        Cancelar Venta
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div>
                </section>

            </main>
        </div>
    </div>

    <script src="js/core.js"></script>
    <script src="js/demo.js"></script>

    <script src="js/layout.js"></script>
    <script src="js/pages/ventas.js"></script>
</body>

</html>
