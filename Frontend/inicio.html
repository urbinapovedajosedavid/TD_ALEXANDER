<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tienda Alexander</title>
    <link rel="stylesheet" href="css/base.css">
</head>

<body>

    <div class="dashboard-layout">

        <!-- El sidebar lo inyecta js/core/layout.js -->
        <aside class="sidebar" id="sidebar"></aside>

        <div class="pagina-admin">

            <header class="barra-superior" id="barraSuperior"></header>

            <main class="tab-content">

                <section class="tarjeta">
                    <h1>Panel de control</h1>

                    <div class="kpi-grid">
                        <article class="kpi-card">
                            <h3>Productos registrados</h3>
                            <p class="kpi-valor" id="kpiProductos">0</p>
                        </article>
                        <article class="kpi-card">
                            <h3>Valor del inventario</h3>
                            <p class="kpi-valor" id="kpiValorInventario">$0.00</p>
                        </article>
                        <article class="kpi-card">
                            <h3>Productos agotados</h3>
                            <p class="kpi-valor" id="kpiAgotados">0</p>
                        </article>
                    </div>

                    <div class="acciones-inventario-pills">
                        <button type="button" id="btnIrInventario" class="btn-pill btn-pill-menta">
                            Ir al inventario
                        </button>
                    </div>
                </section>

                <section class="tarjeta" style="margin-top: 24px;">
                    <h1>Alertas de stock bajo</h1>

                    <div class="tabla-panel">
                        <table class="tabla">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Categoría</th>
                                    <th>Precio</th>
                                    <th>Stock</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody id="tablaStockBajo"></tbody>
                        </table>
                        <div id="mensajeSinAlertas" class="estado-vacio" style="display: none;">
                            No hay productos con stock bajo.
                        </div>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <script src="js/core.js"></script>
    <script src="js/demo.js"></script>

    <script src="js/layout.js"></script>
    <script src="js/pages/inicio.js"></script>
</body>

</html>
