<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Alexander - Acceso</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-contenedor">
        <section class="login-panel">

            <div class="login-brand">
                <div class="logo-circulo">
                    <img src="https://i.postimg.cc/XqZdZjvF/logo-TD.jpg" alt="Gestión Alexander">
                </div>
                <div>
                    <h1>GestiónApp</h1>
                    <p>Tienda Alexander</p>
                </div>
            </div>

            <div class="login-card">
                <h2>Acceder al sistema</h2>

                <form id="formLogin" class="formulario">
                    <label for="usuarioLogin">Usuario</label>
                    <input id="usuarioLogin" name="usuarioLogin" type="text"
                        placeholder="Tu usuario" autocomplete="username" required>

                    <label for="claveLogin">Contraseña</label>
                    <div class="campo-password">
                        <input id="claveLogin" name="claveLogin" type="password"
                            placeholder="Contraseña" autocomplete="current-password" required>
                        <button type="button" class="btn-ver-password" data-target="claveLogin"
                            aria-label="Mostrar contraseña" title="Mostrar contraseña">
                            <svg class="icono-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>

                    <button type="submit" class="btn-pill btn-pill-oscuro">Iniciar sesión</button>

                    <button type="button" id="btnIrRegistro" class="btn-pill btn-pill-menta">
                        Crear cuenta
                    </button>

                    <p id="mensajeLogin" class="mensaje" aria-live="polite"></p>
                </form>
            </div>

        </section>
    </main>
    <script src="js/core.js"></script>
    <script src="js/pages/login.js"></script>
</body>

</html>
