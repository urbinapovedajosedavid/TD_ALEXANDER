<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestiónApp - Panel Principal</title>

    <!-- Hojas de estilo del sistema -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="inicio.css" />
</head>

<body>

    <div class="dashboard-layout">

        <!-- SIDEBAR: Navegación Lateral -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="logo-circulo">
                    <img src="https://i.postimg.cc/XqZdZjvF/logo-TD.jpg" alt="Logo Tienda Alexander" />
                </div>
                <div>
                    <h2>GestiónApp</h2>
                    <p>Control principal</p>
                </div>
            </div>

            <nav class="sidebar-nav" aria-label="Navegación del panel">
                <button class="nav-item nav-item-activa" type="button"
                    onclick="location.href='inicio.html'">Inicio</button>
                <button class="nav-item" type="button" onclick="location.href='ventas.html'">Ventas</button>
                <button class="nav-item" type="button" onclick="location.href='almacen.html'">Inventario</button>
                <button class="nav-item" type="button" onclick="location.href='reportes.html'">Reportes</button>
                <button class="nav-item" type="button" onclick="location.href='provedores.html'">Proveedores</button>
            </nav>

            <div class="sidebar-footer">
                <button class="nav-item nav-item-secundario" type="button">Copia de seguridad</button>
                <small>© 2026 Sistema</small>
            </div>
        </aside>

        <!-- ÁREA PRINCIPAL DE TRABAJO -->
        <div class="pagina-admin">

            <!-- HEADER: Encabezado y perfil -->
            <header class="barra-superior">
                <div class="marca">
                    <div class="logo-circulo">
                        <img src="https://i.postimg.cc/XqZdZjvF/logo-TD.jpg" alt="Logo Tienda" />
                    </div>
                    <div>
                        <h2>Gestión de Tienda Alexander</h2>
                        <p>Panel de administración e inventario</p>
                    </div>
                </div>

                <div class="acciones-superior">
                    <div class="ajustes-wrapper">
                        <button id="botonAjustes" class="boton boton-secundario boton-ajuste" type="button"
                            aria-expanded="false" aria-controls="menuAjustes">
                            ⚙ Ajustes
                        </button>
                        <div id="menuAjustes" class="menu-ajustes oculto" role="menu">
                            <button id="cerrarSesionAjustes" class="menu-ajuste-item" type="button"
                                role="menuitem">Cerrar sesión</button>
                            <button id="cambiarCuentaAjustes" class="menu-ajuste-item" type="button"
                                role="menuitem">Cambiar cuenta</button>
                            <button id="eliminarCuentaAjustes" class="menu-ajuste-item" type="button"
                                role="menuitem">Eliminar cuenta</button>
                            <button id="cambiarContrasenaAjustes" class="menu-ajuste-item" type="button"
                                role="menuitem">Cambiar contraseña</button>
                            <button id="verPerfilesAjustes" class="menu-ajuste-item" type="button" role="menuitem">Ver
                                perfiles</button>
                        </div>
                    </div>
                    <span id="usuarioAdminValor" class="etiqueta-perfil">Usuario: Admin</span>
                </div>
            </header>

        </div>
    </div>

    <script src="../Backend/validacionesUsuario.js"></script>
    <script src="../Backend/app.js"></script>

</body>

</html>
