<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto - Tienda Alexander</title>
    <link rel="stylesheet" href="css/base.css">
</head>

<body>

    <div class="dashboard-layout">

        <aside class="sidebar" id="sidebar"></aside>

        <div class="pagina-admin">

            <header class="barra-superior" id="barraSuperior"></header>

            <main class="tab-content">

                <section class="tarjeta">
                    <h1>Producto</h1>

                    <div class="barra-filtros">
                        <div class="search-bar-pill">
                            <span class="icono-buscar">🔍</span>
                            <input type="text" id="inputBuscarProducto"
                                placeholder="Buscar productos por nombre, código o categoría...">
                        </div>

                        <div class="filtros-wrapper">
                            <button type="button" id="btnAbrirFiltros"
                                class="btn-pill btn-pill-oscuro btn-filtro"
                                aria-expanded="false" aria-controls="panelFiltros">
                                <svg class="icono-filtro" viewBox="0 0 24 24" width="16" height="16"
                                    fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path>
                                </svg>
                                Filtrar
                            </button>

                            <div id="panelFiltros" class="panel-filtros oculto"
                                role="dialog" aria-label="Filtros de productos">
                                <div class="filtro-grupo">
                                    <label for="filtroCategoria">Categoría</label>
                                    <select id="filtroCategoria">
                                        <option value="">Todas las categorías</option>
                                    </select>
                                </div>

                                <div class="filtro-grupo">
                                    <span class="filtro-etiqueta">Ordenar por precio</span>
                                    <div class="orden-precio" role="group" aria-label="Orden por precio">
                                        <button type="button" class="chip-orden" data-orden="asc">
                                            ↑ Menor a mayor
                                        </button>
                                        <button type="button" class="chip-orden" data-orden="desc">
                                            ↓ Mayor a menor
                                        </button>
                                    </div>
                                </div>

                                <div class="panel-filtros-pie">
                                    <button type="button" id="btnLimpiarFiltros"
                                        class="btn-pill btn-pill-oscuro btn-bloque">Limpiar filtros</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="tabla-panel tabla-scroll" id="contenedorTablaProductos">
                        <table class="tabla">
                            <thead>
                                <tr>
                                    <th>Nombre del Producto</th>
                                    <th>Código</th>
                                    <th>Precio</th>
                                    <th>Stock</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaProductos"></tbody>
                        </table>

                        <div id="mensajeSinProductos" class="estado-vacio" style="display: none;">
                            No hay productos disponibles.
                        </div>
                    </div>

                    <div class="acciones-inventario-pills">
                        <button type="button" id="botonAgregarProducto" class="btn-pill btn-pill-menta">
                            Añadir Nuevo Producto
                        </button>
                    </div>
                </section>

            </main>
        </div>
    </div>

    
    <div id="modalProducto" class="modal modal-oculto" aria-hidden="true">
        <div class="modal-contenido">
            <div class="modal-cabecera">
                <h3 id="tituloModal">Añadir Nuevo Producto</h3>
                <button id="cerrarModalProducto" class="boton-cerrar" type="button"
                    aria-label="Cerrar">&times;</button>
            </div>

            <form id="formProducto" class="form-producto">
                <input type="hidden" id="productoId">

                <div class="form-row">
                    <label for="prodNombre">Nombre del Producto *</label>
                    <input type="text" id="prodNombre" required>
                </div>

                <div class="form-row">
                    <label for="prodCodigo">Código de Barras</label>
                    <input type="text" id="prodCodigo">
                </div>

                <div class="form-row">
                    <label for="selectCategoria">Categoría *</label>
                    <select id="selectCategoria">
                        <option value="">Cargando categorías...</option>
                    </select>
                </div>

                <div class="form-row" id="contenedorOtraCategoria" style="display: none;">
                    <label for="inputOtraCategoria">Nombre de la nueva categoría *</label>
                    <input type="text" id="inputOtraCategoria" placeholder="Ej. Electrónicos, Muebles...">
                </div>

                <div class="form-row">
                    <label for="prodPrecio">Precio *</label>
                    <input type="number" step="0.01" min="0" id="prodPrecio" required>
                </div>

                <div class="form-row">
                    <label for="prodStock">Stock Inicial *</label>
                    <input type="number" min="0" max="64" id="prodStock" required>
                </div>

                <div class="modal-acciones">
                    <button type="button" id="btnCancelarProducto" class="btn-pill btn-pill-oscuro">
                        Cancelar
                    </button>
                    <button type="submit" class="btn-pill btn-pill-menta">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/core.js"></script>
    <script src="js/demo.js"></script>

    <script src="js/layout.js"></script>
    <script src="js/pages/almacen.js"></script>
</body>

</html>
