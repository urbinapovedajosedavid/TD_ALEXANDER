<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock - Tienda Alexander</title>
    <link rel="stylesheet" href="css/base.css">
</head>

<body>

    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <div class="pagina-admin">
            <header class="barra-superior" id="barraSuperior"></header>

            <main class="tab-content">
                <section class="tarjeta">
                    <h1>Control de Stock (Productos Agotados y Bajos)</h1>

                    <div class="tabla-panel tabla-scroll" id="contenedorTablaStock" style="margin-top: 20px;">
                        <table class="tabla">
                            <thead>
                                <tr>
                                    <th>Nombre del Producto</th>
                                    <th>Código</th>
                                    <th>Precio</th>
                                    <th>Stock</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaStock"></tbody>
                        </table>

                        <div id="mensajeSinStock" class="estado-vacio" style="display: none;">
                            No hay productos con stock agotado o bajo (0 a 5 unidades).
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- Modal para Modificar / Recargar Stock Crítico -->
    <div id="modalStock" class="modal modal-oculto" aria-hidden="true">
        <div class="modal-contenido">
            <div class="modal-cabecera">
                <h3 id="tituloModalStock">Recargar Stock</h3>
                <button id="cerrarModalStock" class="boton-cerrar" type="button" aria-label="Cerrar">&times;</button>
            </div>

            <form id="formStock" class="form-producto">
                <input type="hidden" id="stockProductoId">

                <div class="form-row">
                    <label for="stockProdNombre">Producto</label>
                    <input type="text" id="stockProdNombre" readonly style="background-color: #e9ecef;">
                </div>

                <div class="form-row">
                    <label for="stockProdCantidad">Nuevo Stock (Máx. 64) *</label>
                    <input type="number" min="0" max="64" id="stockProdCantidad" required>
                </div>

                <div class="modal-acciones">
                    <button type="button" id="btnCancelarStock" class="btn-pill btn-pill-oscuro">
                        Cancelar
                    </button>
                    <button type="submit" class="btn-pill btn-pill-menta">Guardar Recarga</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/core.js"></script>
    <script src="js/demo.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/pages/stock.js"></script>
</body>

</html>
